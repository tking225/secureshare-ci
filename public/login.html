<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion · SecureShare CI</title>
<meta name="description" content="Connectez-vous à votre compte SecureShare CI.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="login">
<header class="site-header">
  <div class="container inner">
    <a class="brand" href="/">
      <img src="/favicon.svg" alt="">
      SecureShare CI
    </a>
    <nav class="site-nav">
      <a href="/register.html">Créer un compte</a>
    </nav>
  </div>
</header>

<main>
  <div class="narrow animate-in">
    <h1>Connexion</h1>
    <p>Entrez vos identifiants pour accéder à votre tableau de bord.</p>

    <div id="alert"></div>

    <form id="form" class="card" novalidate>
      <div class="form-group">
        <label for="email">Adresse email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <button class="btn btn-accent" type="submit" id="submit">Se connecter</button>
    </form>

    <p class="muted mt-2">Pas encore de compte ? <a href="/register.html">Créez-en un</a>.</p>
  </div>
</main>

<footer class="site-footer">
  <div class="container inner">
    <div>© <span id="y"></span> SecureShare CI</div>
    <nav>
      <a href="/cgu.html">CGU</a>
      <a href="/rgpd.html">Données personnelles</a>
    </nav>
  </div>
  <script src="/js/auth.js"></script>
  <script src="/js/init.js"></script>
</footer>
</body>
</html>
